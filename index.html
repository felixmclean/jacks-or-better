<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jacks or Better Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>♠</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Jacks or Better Calculator</h1>
    <p>Exact best-hold strategy for 9/6 Jacks or Better,<br>computed by enumerating every possible draw.</p>

  <main>
    <section id="hand" aria-label="Your hand"></section>
    <div id="result" role="status"></div>

    <section id="grid" aria-label="Card picker"></section>
  </main>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
