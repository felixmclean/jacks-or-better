<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests</title>
  <style>
    .pass { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>Tests</h1>
  <p id="summary">running...</p>
  <ul id="results"></ul>
  <script type="module">
    import { runEvaluatorTests } from './evaluator.test.js';
    import { runSolverTests } from './solver.test.js';

    const results = [...runEvaluatorTests(), ...runSolverTests()];
    const list = document.getElementById('results');
    for (const { hand, pass } of results) {
      const item = document.createElement('li');
      item.className = pass ? 'pass' : 'fail';
      item.textContent = `${pass ? 'pass' : 'fail'} - ${hand}`;
      list.append(item);
    }

    const failures = results.filter((r) => !r.pass).length;
    document.getElementById('summary').textContent =
      `${results.length - failures} passed, ${failures} failed`;
  </script>
</body>
</html>
